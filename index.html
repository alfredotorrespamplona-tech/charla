<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Practique inglés hablando con personajes en lugares de la vida real.">
  <meta name="theme-color" content="#c3122b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Charla">
  <title>Charla</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>
  <noscript>Charla necesita JavaScript. Ábrala en Chrome.</noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    // El modo sin conexión solo funciona en https (o en localhost para pruebas).
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
      // La primera vez, la página no pasa por el service worker y la voz natural usaría un solo núcleo:
      // se recarga una vez cuando él toma el control.
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (!self.crossOriginIsolated && !sessionStorage.getItem('charla.coi')) {
          sessionStorage.setItem('charla.coi', '1');
          location.reload();
        }
      });
    }
  </script>
</body>
</html>
